[project]
name = "line-shop-bot"
version = "0.1.0"
description = "Open-source LINE OA ordering bot for Thai shops: menu, cart, AI order parsing, PromptPay QR and owner alerts"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Yavin Songkham" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "qrcode[pil]>=7.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "anyio>=4", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E741"]
